<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" fill="none" role="img" aria-labelledby="t">
  <title id="t">PhoneScope-style phone microscope illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2418"/>
      <stop offset="100%" stop-color="#2a3320"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4d4"/>
      <stop offset="100%" stop-color="#c8c4b0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <g transform="translate(220 80)" filter="url(#soft)">
    <path fill="url(#paper)" stroke="#7a8c52" stroke-width="2" d="M280 20 L340 400 L20 400 L80 20 Z" opacity="0.95"/>
    <circle cx="200" cy="120" r="42" fill="#1a1f14" stroke="#dcecab" stroke-width="3"/>
    <circle cx="200" cy="120" r="18" fill="#4a7c8c" opacity="0.85"/>
    <path stroke="#46581f" stroke-width="3" stroke-linecap="round" d="M200 162 L200 340"/>
    <rect x="130" y="340" width="140" height="44" rx="6" fill="#3d4a2a" opacity="0.9"/>
  </g>
  <text x="400" y="520" text-anchor="middle" fill="#8a9a72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="0.2em">PHONESCOPE / BIOLOGY</text>
</svg>
